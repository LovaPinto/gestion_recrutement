# ===========================================================
# Paramètres globaux
# ===========================================================
parameters:
    openai_api_key: '%env(OPENAI_API_KEY)%'

# ===========================================================
# Services
# ===========================================================
services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    Symfony\Component\Mailer\MailerInterface: '@mailer.mailer'
